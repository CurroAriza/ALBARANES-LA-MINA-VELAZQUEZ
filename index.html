<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Albaranes La Mina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#101A15;color:#EFE3C6;font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;text-align:center}
.card img{width:132px;border-radius:6px;margin-bottom:22px}
.eyebrow{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#ADA891;margin:0}
h1{font-family:Oswald,sans-serif;font-weight:600;font-size:28px;line-height:1.1;letter-spacing:.02em;text-transform:uppercase;margin:6px 0 10px}
.lead{color:#ADA891;font-size:14px;margin:0 0 22px}
form{display:grid;gap:12px;text-align:left}
label.f{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ADA891}
.row{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:13px 84px 13px 14px;border-radius:10px;border:1px solid #3A463A;background:#1B241C;color:#F5EEDB}
input::placeholder{color:#7F8676}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:transparent;border:0;color:#C7C1A8;padding:9px 10px;border-radius:7px;cursor:pointer}
.show:hover{background:#242E24}
.go{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;border:0;border-radius:10px;padding:13px 16px;background:#EFE3C6;color:#101A15;cursor:pointer;font-weight:600}
.go:hover{background:#fff6dc}
.go[disabled]{opacity:.6;cursor:progress}
.rem{display:flex;gap:9px;align-items:center;color:#C7C1A8;font-size:13.5px;cursor:pointer}
.rem input{width:17px;height:17px;accent-color:#EFE3C6}
.err{min-height:21px;margin:0;color:#F0A27A;font-size:13.5px;text-align:center}
:is(input,button):focus-visible{outline:2px solid #EFE3C6;outline-offset:2px}
noscript p{color:#F0A27A}
</style>
</head>

  var $=function(id){return document.getElementById(id)};
  function bytes(x){var s=atob(x),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a}
  function b64(a){var s='';for(var k=0;k<a.length;k++)s+=String.fromCharCode(a[k]);return btoa(s)}
  /* Se abre siempre la última versión publicada, aunque esta pantalla venga de la caché del navegador o lleve rato abierta */
  async function latest(){
    try{
      var c=new AbortController(), t=setTimeout(function(){c.abort()},8000);
      var r=await fetch(location.pathname,{cache:'no-store',signal:c.signal}), x=await r.text(); clearTimeout(t);
      var m=r.ok&&x.match(/var P=\{s:"([^"]+)",i:"([^"]+)",n:(\d+),d:"([^"]+)"\}/);

    }catch(e){}
    return P;
  }
  async function derive(pw,Q){

  async function decrypt(raw,Q){

  }
  function show(html){

    var w=function(){document.open();document.write(html);document.close()};

  }
  function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function forget(){try{localStorage.removeItem(KEY)}catch(e){}}
  if(!(window.crypto&&crypto.subtle)){$('err').textContent='Este navegador no puede abrir la página. Prueba con Chrome o Safari actualizados.';return}
  var s=stored();

    latest().then(function(Q){return decrypt(bytes(s),Q)}).then(show).catch(function(){forget();card.style.visibility='';$('pw').focus()});
  }
  $('sh').onclick=function(){var p=$('pw'),on=p.type==='password';p.type=on?'text':'password';this.textContent=on?'Ocultar':'Mostrar';this.setAttribute('aria-pressed',on)};
